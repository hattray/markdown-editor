<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Free MD Viewer — open, read & edit markdown files in your browser</title>
<meta name="description" content="Free markdown viewer and editor that runs entirely in your browser. Drag & drop a .md file to read it beautifully rendered, edit it, and save it back — nothing is ever uploaded.">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #fafafa;
    --panel: #ffffff;
    --border: #e4e4e7;
    --border-soft: #ececef;
    --text: #18181b;
    --text-soft: #52525b;
    --text-faint: #a1a1aa;
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.08);
    --code-bg: #f4f4f5;
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  [data-theme="dark"] {
    --bg: #111113;
    --panel: #18181b;
    --border: #27272a;
    --border-soft: #202023;
    --text: #e4e4e7;
    --text-soft: #a1a1aa;
    --text-faint: #63636b;
    --accent: #60a5fa;
    --accent-soft: rgba(96, 165, 250, 0.10);
    --code-bg: #1f1f23;
    --danger: #f87171;
    --shadow: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    letter-spacing: -0.006em;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ─────────────────────────────────── */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .brand {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text);
    white-space: nowrap;
  }
  .brand svg { width: 16px; height: 16px; color: var(--accent); }

  .filename-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 0 1 auto;
  }
  #filename {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-soft);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 3px 7px;
    min-width: 60px;
    max-width: 260px;
    width: 16ch;
    outline: none;
  }
  #filename:hover { border-color: var(--border); }
  #filename:focus { border-color: var(--accent); background: var(--panel); color: var(--text); }
  .dirty-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .dirty-dot.on { opacity: 1; }

  .spacer { flex: 1; }

  .seg {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
    flex: none;
  }
  .seg button {
    border: none;
    background: transparent;
    color: var(--text-soft);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  .seg button:hover { color: var(--text); }
  .seg button.active {
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow);
    border: 1px solid var(--border-soft);
    padding: 3px 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    flex: none;
  }
  .btn:hover { border-color: var(--text-faint); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:hover { opacity: 0.9; }
  [data-theme="dark"] .btn.primary { color: #0b1120; }
  .btn.icon { padding: 5px 8px; }
  .btn svg { width: 14px; height: 14px; }
  kbd.hint {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    font-weight: 400;
  }
  .btn.primary kbd.hint { color: rgba(255,255,255,0.65); }
  [data-theme="dark"] .btn.primary kbd.hint { color: rgba(11,17,32,0.6); }

  /* ── Panes ───────────────────────────────────── */
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #editor-pane, #preview-pane {
    flex: 1 1 50%;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  #editor-pane { border-right: 1px solid var(--border); }
  body[data-view="edit"] #preview-pane { display: none; }
  body[data-view="edit"] #editor-pane { border-right: none; }
  body[data-view="preview"] #editor-pane { display: none; }

  #editor {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: var(--panel);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    padding: 28px 32px 45vh;
    tab-size: 2;
  }
  #editor::placeholder { color: var(--text-faint); }

  #preview-pane {
    overflow-y: auto;
    background: var(--bg);
  }
  #preview {
    max-width: var(--reader-width, 760px);
    width: 100%;
    margin: 0 auto;
    padding: 32px 40px 45vh;
    min-width: 0;
  }

  /* ── Table of contents (own column, right of the preview) ── */
  #toc {
    display: none;
    flex: none;
    width: 232px;
    min-height: 0;
    overflow-y: auto;
    background: var(--bg);
    border-left: 1px solid var(--border-soft);
    padding: 26px 16px 26px 6px;
    font-size: 12.5px;
  }
  body.toc-open #toc { display: block; }

  /* There is no room for a third column on a phone, so the contents becomes a
     slide-over drawer with a tap-anywhere backdrop. */
  #toc-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 69;
  }
  @media (max-width: 900px) {
    body.toc-open #toc {
      display: block;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(300px, 84vw);
      z-index: 70;
      background: var(--panel);
      border-left: 1px solid var(--border);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.2);
      padding: 16px 12px calc(16px + env(safe-area-inset-bottom, 0px));
      font-size: 14px;
      overscroll-behavior: contain;
    }
    body.toc-open #toc a { padding: 9px 10px; }   /* finger-sized tap targets */
    body.toc-open #toc-backdrop { display: block; }
  }

  /* Nothing to jump to while the preview is hidden — keep this last so it wins. */
  body[data-view="edit"] #toc, body[data-view="edit"] #toc-backdrop { display: none; }
  #toc .toc-title {
    font-weight: 600;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    margin: 0 0 8px 10px;
  }
  #toc .toc-empty { color: var(--text-faint); font-size: 12px; margin-left: 10px; }
  #toc a {
    display: block;
    color: var(--text-soft);
    text-decoration: none;
    padding: 3px 8px;
    border-left: 2px solid var(--border-soft);
    line-height: 1.45;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #toc a:hover { color: var(--text); border-left-color: var(--accent); background: var(--accent-soft); }
  #toc a.d2 { padding-left: 20px; }
  #toc a.d3 { padding-left: 32px; }
  #toc a.d4 { padding-left: 44px; }

  /* ── Rendered markdown ───────────────────────── */
  #preview { font-size: var(--reader-size, 14.5px); line-height: 1.65; color: var(--text); }
  #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.3;
    margin: 1.6em 0 0.55em;
  }
  #preview > :first-child { margin-top: 0; }
  #preview h1 { font-size: 1.75em; padding-bottom: 0.35em; border-bottom: 1px solid var(--border-soft); }
  #preview h2 { font-size: 1.35em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-soft); }
  #preview h3 { font-size: 1.15em; }
  #preview h4 { font-size: 1em; }
  #preview h5, #preview h6 { font-size: 0.9em; color: var(--text-soft); }
  #preview p, #preview ul, #preview ol, #preview blockquote, #preview pre, #preview table { margin: 0 0 0.9em; }
  #preview ul, #preview ol { padding-left: 1.6em; }
  #preview li { margin: 0.25em 0; }
  #preview li > ul, #preview li > ol { margin-bottom: 0; }
  #preview li.task { list-style: none; margin-left: -1.4em; }
  #preview li input[type="checkbox"] { margin-right: 0.45em; accent-color: var(--accent); vertical-align: -1px; }
  #preview a { color: var(--accent); text-decoration: none; }
  #preview a:hover { text-decoration: underline; }
  #preview strong { font-weight: 600; }
  #preview code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--code-bg);
    border: 1px solid var(--border-soft);
    border-radius: 5px;
    padding: 0.12em 0.35em;
  }
  #preview pre {
    background: var(--code-bg);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 14px 16px;
    overflow-x: auto;
  }
  #preview pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
  #preview blockquote {
    border-left: 3px solid var(--border);
    padding: 0.1em 0 0.1em 1em;
    color: var(--text-soft);
  }
  #preview blockquote > :last-child { margin-bottom: 0; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  #preview img { max-width: 100%; border-radius: 8px; }
  #preview table { border-collapse: collapse; width: 100%; font-size: 0.95em; display: block; overflow-x: auto; }
  #preview th, #preview td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
  #preview th { background: var(--code-bg); font-weight: 600; }
  #preview del { color: var(--text-faint); }

  /* ── GitHub callouts ─────────────────────────── */
  #preview blockquote.callout {
    border-left: 3px solid var(--co);
    border-radius: 0 8px 8px 0;
    background: var(--code-bg);
    padding: 11px 15px;
    color: var(--text);
  }
  #preview .callout-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 600;
    font-size: 0.92em;
    color: var(--co);
    margin-bottom: 5px;
  }
  #preview .callout-title svg { width: 15px; height: 15px; flex: none; }
  .callout-note      { --co: #2563eb; }
  .callout-tip       { --co: #16a34a; }
  .callout-important { --co: #9333ea; }
  .callout-warning   { --co: #d97706; }
  .callout-caution   { --co: #dc2626; }
  [data-theme="dark"] .callout-note      { --co: #60a5fa; }
  [data-theme="dark"] .callout-tip       { --co: #4ade80; }
  [data-theme="dark"] .callout-important { --co: #c084fc; }
  [data-theme="dark"] .callout-warning   { --co: #fbbf24; }
  [data-theme="dark"] .callout-caution   { --co: #f87171; }

  /* ── Syntax highlighting (github-flavored) ───── */
  .hljs { color: var(--text); background: transparent; }
  .hljs-comment, .hljs-quote { color: var(--text-faint); }
  .hljs-keyword, .hljs-selector-tag, .hljs-doctag, .hljs-section, .hljs-template-tag, .hljs-deletion, .hljs-meta .hljs-keyword { color: #cf222e; }
  .hljs-title, .hljs-title.class_, .hljs-title.function_ { color: #8250df; }
  .hljs-attr, .hljs-attribute, .hljs-literal, .hljs-number, .hljs-operator, .hljs-variable, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id, .hljs-selector-pseudo, .hljs-meta { color: #0550ae; }
  .hljs-string, .hljs-regexp, .hljs-addition, .hljs-meta .hljs-string { color: #116329; }
  .hljs-built_in, .hljs-symbol, .hljs-type { color: #953800; }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 600; }
  [data-theme="dark"] .hljs-keyword, [data-theme="dark"] .hljs-selector-tag, [data-theme="dark"] .hljs-doctag, [data-theme="dark"] .hljs-section, [data-theme="dark"] .hljs-template-tag, [data-theme="dark"] .hljs-deletion, [data-theme="dark"] .hljs-meta .hljs-keyword { color: #ff7b72; }
  [data-theme="dark"] .hljs-title, [data-theme="dark"] .hljs-title.class_, [data-theme="dark"] .hljs-title.function_ { color: #d2a8ff; }
  [data-theme="dark"] .hljs-attr, [data-theme="dark"] .hljs-attribute, [data-theme="dark"] .hljs-literal, [data-theme="dark"] .hljs-number, [data-theme="dark"] .hljs-operator, [data-theme="dark"] .hljs-variable, [data-theme="dark"] .hljs-selector-attr, [data-theme="dark"] .hljs-selector-class, [data-theme="dark"] .hljs-selector-id, [data-theme="dark"] .hljs-selector-pseudo, [data-theme="dark"] .hljs-meta { color: #79c0ff; }
  [data-theme="dark"] .hljs-string, [data-theme="dark"] .hljs-regexp, [data-theme="dark"] .hljs-addition, [data-theme="dark"] .hljs-meta .hljs-string { color: #a5d6ff; }
  [data-theme="dark"] .hljs-built_in, [data-theme="dark"] .hljs-symbol, [data-theme="dark"] .hljs-type { color: #ffa657; }

  /* ── Per-block download tools ────────────────── */
  .blk-tools {
    position: absolute;
    top: 6px;
    right: 6px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.12s;
    z-index: 2;
  }
  .mermaid-block:hover .blk-tools, .table-wrap:hover .blk-tools,
  .blk-tools:focus-within { opacity: 1; }
  .blk-tools button {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-soft);
    cursor: pointer;
  }
  .blk-tools button:hover { color: var(--accent); border-color: var(--accent); }
  .table-wrap { position: relative; margin: 0 0 0.9em; }
  .table-wrap table { margin: 0; }

  /* ── Math & diagrams ─────────────────────────── */
  .katex-block { overflow-x: auto; margin: 0 0 0.9em; padding: 2px 0; }
  #preview .katex { font-size: 1.08em; }
  .math-err { color: var(--danger); font-family: var(--mono); font-size: 0.85em; }
  .mermaid-block { position: relative; margin: 0 0 0.9em; overflow-x: auto; text-align: center; }
  .mermaid-block svg { max-width: 100%; height: auto; }
  #preview pre.mermaid-err {
    text-align: left;
    border-color: var(--danger);
    white-space: pre-wrap;
    color: var(--text-soft);
    font-size: 12px;
  }

  /* ── Reader popover ──────────────────────────── */
  .popover-wrap { position: relative; display: inline-flex; flex: none; }
  #reader-pop {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    padding: 12px 14px 14px;
    width: 224px;
    z-index: 60;
    display: none;
    font-size: 12px;
  }
  #reader-pop.on { display: block; }
  #reader-pop label { display: flex; justify-content: space-between; color: var(--text-soft); margin: 8px 0 5px; font-weight: 500; }
  #reader-pop label:first-child { margin-top: 0; }
  #reader-pop input[type="range"] { width: 100%; accent-color: var(--accent); }
  #reader-pop .widths { display: flex; gap: 4px; }
  #reader-pop .wbtn {
    flex: 1;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-soft);
    font: inherit;
    font-size: 11px;
    padding: 4px 0;
    border-radius: 6px;
    cursor: pointer;
  }
  #reader-pop .wbtn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .btn.toggled { border-color: var(--accent); color: var(--accent); }

  /* ── Export menu ─────────────────────────────── */
  #export-pop {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    padding: 4px;
    width: 216px;
    z-index: 60;
    display: none;
  }
  #export-pop.on { display: block; }
  #export-pop button {
    display: flex;
    align-items: baseline;
    gap: 7px;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    padding: 7px 9px;
    border-radius: 7px;
    cursor: pointer;
  }
  #export-pop button:hover { background: var(--accent-soft); color: var(--accent); }
  #export-pop button:disabled { opacity: 0.5; cursor: default; }
  #export-pop button:disabled:hover { background: transparent; color: var(--text); }
  #export-pop .ext {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    margin-left: auto;
  }
  #export-pop .sep { height: 1px; background: var(--border-soft); margin: 4px 6px; }

  /* ── Status bar ──────────────────────────────── */
  footer {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 5px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-faint);
    font-family: var(--mono);
  }
  footer .spacer { flex: 1; }
  #status { color: var(--text-soft); font-family: var(--sans); }

  /* ── Drop overlay ────────────────────────────── */
  #drop-overlay {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--bg) 75%, transparent);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    pointer-events: none;
  }
  #drop-overlay.on { display: flex; }
  #drop-overlay .card {
    border: 2px dashed var(--accent);
    border-radius: 16px;
    background: var(--panel);
    padding: 42px 64px;
    text-align: center;
    color: var(--text);
    font-weight: 500;
  }
  #drop-overlay .card .sub { color: var(--text-soft); font-weight: 400; font-size: 12.5px; margin-top: 6px; }

  @media (max-width: 720px) {
    body[data-view="split"] main { flex-direction: column; }
    body[data-view="split"] #editor-pane { border-right: none; border-bottom: 1px solid var(--border); }
    .hide-sm { display: none; }
    #preview { padding: 20px 18px 40vh; }
    #editor { padding: 18px 18px 40vh; }
  }

  @media print {
    /* Always print on white — dark backgrounds waste ink and read badly. */
    :root, :root[data-theme="dark"], :root[data-theme="light"] {
      --bg: #ffffff; --panel: #ffffff; --text: #18181b; --text-soft: #52525b;
      --text-faint: #71717a; --border: #d4d4d8; --border-soft: #e4e4e7;
      --code-bg: #f6f6f7; --accent: #2563eb;
    }
    header, footer, #editor-pane, #drop-overlay, #toc, #reader-pop, #export-pop,
    .blk-tools { display: none !important; }
    html, body { height: auto; overflow: visible; display: block; }
    main { display: block; }
    #preview-pane { display: block !important; overflow: visible; }
    #preview { padding: 0; max-width: none; }
    #preview pre, #preview blockquote, #preview table, #preview img,
    .mermaid-block, .katex-block { break-inside: avoid; }
    #preview h1, #preview h2, #preview h3, #preview h4 { break-after: avoid; }
    @page { margin: 16mm; }
  }
</style>

</head>

<header>
  <span class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M7 15V9l2.5 3L12 9v6"/><path d="M16 13l2 2 2-2"/><path d="M18 9v6"/></svg>
    Free MD Viewer
  </span>
  <span class="filename-wrap">
    <input id="filename" value="untitled.md" spellcheck="false" autocomplete="off" title="File name (click to rename)">
    <span class="dirty-dot" id="dirty-dot" title="Unsaved changes"></span>
  </span>
  <span class="spacer"></span>
  <div class="seg" role="tablist" aria-label="View mode">
    <button data-mode="edit">Edit</button>
    <button data-mode="split" class="active">Split</button>
    <button data-mode="preview">Preview</button>
  </div>
  <button class="btn" id="btn-new" title="New document">New</button>
  <button class="btn" id="btn-open" title="Open a markdown file (Ctrl+O)">Open</button>
  <span class="popover-wrap">
    <button class="btn" id="btn-export" title="Export this document">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span class="hide-sm">Export</span>
    </button>
    <div id="export-pop">
      <button data-exp="md">Markdown source <span class="ext">.md</span></button>
      <div class="sep"></div>
      <button data-exp="html">Rendered page <span class="ext">.html</span></button>
      <button data-exp="png">Image of preview <span class="ext">.png</span></button>
      <button data-exp="pdf">Print / Save as PDF <span class="ext">.pdf</span></button>
    </div>
  </span>
  <button class="btn primary" id="btn-save" title="Save (Ctrl+S)">Save <kbd class="hint" id="save-kbd">⌘S</kbd></button>
  <button class="btn icon" id="btn-toc" title="Table of contents">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
  </button>
  <span class="popover-wrap">
    <button class="btn icon" id="btn-reader" title="Reading options" style="font-size:12px;font-weight:600;">Aa</button>
    <div id="reader-pop">
      <label>Text size <span id="size-val">14px</span></label>
      <input type="range" id="size-range" min="12" max="20" step="0.5">
      <label>Line width</label>
      <div class="widths">
        <button class="wbtn" data-w="620">Narrow</button>
        <button class="wbtn" data-w="760">Default</button>
        <button class="wbtn" data-w="920">Wide</button>
        <button class="wbtn" data-w="0">Full</button>

  <button class="btn icon" id="btn-theme" title="Toggle theme">
    <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</header>

<main>
  <div id="editor-pane">
    <textarea id="editor" spellcheck="false" placeholder="Type markdown here, or drop a .md file anywhere…"></textarea>
  </div>
  <div id="preview-pane"><article id="preview"></article></div>
  <div id="toc-backdrop"></div>
  <nav id="toc" aria-label="Table of contents"></nav>
</main>

<footer>
  <span id="stat-words">0 words</span>
  <span id="stat-chars">0 chars</span>
  <span id="stat-lines" class="hide-sm">1 line</span>
  <span class="spacer"></span>
  <span id="status"></span>
  <span class="hide-sm">everything stays on your device</span>
</footer>

<div id="drop-overlay"><div class="card">Drop your markdown file<div class="sub">.md, .markdown or any text file — it never leaves your browser</div></div></div>

<input type="file" id="file-input" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" style="display:none">

<script>/*__MARKED__*/</script>
<script>/*__PURIFY__*/</script>
<script>/*__HLJS__*/</script>
<script>/*__KATEX__*/</script>
<script>/*__MERMAID__*/</script>
<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const editor = $("editor"), preview = $("preview"), previewPane = $("preview-pane");
  const filenameEl = $("filename"), dirtyDot = $("dirty-dot"), statusEl = $("status");
  const DRAFT_KEY = "md-editor-draft-v1";
  const THEME_KEY = "md-editor-theme";
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || "");
  $("save-kbd").textContent = isMac ? "⌘S" : "Ctrl+S";

  let fileHandle = null;     // FileSystemFileHandle when opened via picker/drop (Chromium)
  let dirty = false;
  let statusTimer = null;

  /* ── Markdown rendering ─────────────────────── */
  marked.use({ gfm: true, breaks: false });
  DOMPurify.addHook("afterSanitizeAttributes", (node) => {
    if (node.tagName === "A") {
      node.setAttribute("target", "_blank");
      node.setAttribute("rel", "noopener noreferrer");
    }
  });

  const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  /* Math is pulled out BEFORE markdown parsing (marked would mangle _ and *
     inside TeX) and re-injected into the sanitized DOM afterwards. Private-use
     characters make placeholders that survive marked untouched. */
  const PH = (i) => "\uE000M" + i + "\uE001";
  function extractMath(src) {
    const math = [];
    const out = [];
    let inFence = false, fenceCh = "";
    let disp = null, dispPrefix = "";
    for (const rawLine of src.split("\n")) {
      let line = rawLine;
      if (disp) {
        const close = line.indexOf("$$");
        if (close === -1) { disp.push(line); continue; }
        disp.push(line.slice(0, close));
        math.push({ tex: disp.join("\n"), display: true });
        out.push(dispPrefix + PH(math.length - 1) + line.slice(close + 2));
        disp = null; dispPrefix = "";
        continue;
      }
      const fm = line.match(/^\s{0,3}(`{3,}|~{3,})/);
      if (fm) {
        if (!inFence) { inFence = true; fenceCh = fm[1][0]; }
        else if (fm[1][0] === fenceCh) inFence = false;
        out.push(line); continue;
      }
      if (inFence) { out.push(line); continue; }
      let res = "", j = 0, opened = false;
      while (j < line.length) {
        const c = line[j];
        if (c === "`") {
          let k = j; while (line[k] === "`") k++;
          const run = k - j;
          let m = k, close = -1;
          while (m < line.length) {
            if (line[m] === "`") { let m2 = m; while (line[m2] === "`") m2++; if (m2 - m === run) { close = m2; break; } m = m2; }
            else m++;
          }
          if (close !== -1) { res += line.slice(j, close); j = close; } else { res += line.slice(j, k); j = k; }
          continue;
        }
        if (c === "\\" && (line[j + 1] === "(" || line[j + 1] === "[")) {
          const closer = line[j + 1] === "(" ? "\\)" : "\\]";
          const end = line.indexOf(closer, j + 2);
          if (end !== -1) { math.push({ tex: line.slice(j + 2, end), display: line[j + 1] === "[" }); res += PH(math.length - 1); j = end + 2; continue; }
          res += c; j++; continue;
        }
        if (c === "$") {
          if (line[j + 1] === "$") {
            const end = line.indexOf("$$", j + 2);
            if (end !== -1) { math.push({ tex: line.slice(j + 2, end), display: true }); res += PH(math.length - 1); j = end + 2; continue; }
            disp = [line.slice(j + 2)]; dispPrefix = res; opened = true; break;
          }
          let end = -1;
          for (let m = j + 1; m < line.length; m++) {
            if (line[m] === "$") { if (line[m - 1] !== "\\" && line[m - 1] !== " " && m > j + 1) end = m; break; }
          }
          if (end !== -1 && line[j + 1] !== " ") {
            const tex = line.slice(j + 1, end);
            if (!/^[\d.,]*$/.test(tex)) { math.push({ tex, display: false }); res += PH(math.length - 1); j = end + 1; continue; }
          }
          res += c; j++; continue;
        }
        res += c; j++;
      }
      if (!opened) out.push(res);
    }
    if (disp) out.push(dispPrefix + "$$" + (disp.length ? "\n" : "") + disp.join("\n"));
    return { src: out.join("\n"), math };
  }

  function injectMath(mathList) {
    if (!mathList.length) return;
    const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) { if (n.nodeValue.indexOf("\uE000") !== -1) nodes.push(n); }
    for (const node of nodes) {
      if (node.parentElement && node.parentElement.closest("code, pre")) continue;
      const parts = node.nodeValue.split(/(\uE000M\d+\uE001)/);
      const frag = document.createDocumentFragment();
      for (const part of parts) {
        const m = part.match(/^\uE000M(\d+)\uE001$/);
        if (!m || !mathList[+m[1]]) { if (part) frag.appendChild(document.createTextNode(part)); continue; }
        const item = mathList[+m[1]];
        const holder = document.createElement(item.display ? "div" : "span");
        if (item.display) holder.className = "katex-block";
        let html;
        try { html = katex.renderToString(item.tex, { displayMode: item.display, throwOnError: false }); }
        catch (e) { html = '<span class="math-err">' + escapeHtml(item.tex) + "</span>"; }
        holder.innerHTML = DOMPurify.sanitize(html, { USE_PROFILES: { html: true, mathMl: true, svg: true } });
        frag.appendChild(holder);
      }
      node.parentNode.replaceChild(frag, node);
    }
  }

  /* GitHub-style callouts: > [!NOTE] etc. */
  const CALLOUT_META = {
    note:      ["Note",      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'],
    tip:       ["Tip",       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>'],
    important: ["Important", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="12" y1="7" x2="12" y2="11"/><line x1="12" y1="14" x2="12.01" y2="14"/></svg>'],
    warning:   ["Warning",   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'],
    caution:   ["Caution",   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'],
  };
  function transformCallouts() {
    preview.querySelectorAll("blockquote").forEach((bq) => {
      const p = bq.firstElementChild;
      if (!p || p.tagName !== "P" || !p.firstChild || p.firstChild.nodeType !== 3) return;
      const m = p.firstChild.nodeValue.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i);
      if (!m) return;
      const kind = m[1].toLowerCase();
      p.firstChild.nodeValue = p.firstChild.nodeValue.slice(m[0].length);
      if (!p.firstChild.nodeValue) p.firstChild.remove();
      if (p.firstChild && p.firstChild.nodeName === "BR") p.firstChild.remove();
      if (!p.hasChildNodes()) p.remove();
      bq.classList.add("callout", "callout-" + kind);
      const title = document.createElement("div");
      title.className = "callout-title";
      title.innerHTML = CALLOUT_META[kind][1] + CALLOUT_META[kind][0];
      bq.prepend(title);
    });
  }

  /* Code highlighting + mermaid diagrams */
  let mermaidSeq = 0;
  let mermaidPending = Promise.resolve();   // awaited by the PDF export
  function initMermaid() {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: theme === "dark" ? "dark" : "default",
      fontFamily: "-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif",
    });
  }
  async function renderMermaidJobs(jobs) {
    let n = 0;
    for (const { div, src } of jobs) {
      const id = "mmd-" + (++mermaidSeq);
      n++;
      const index = n;
      try {
        const { svg } = await mermaid.render(id, src);
        div.innerHTML = svg;
        const el = div.querySelector("svg");
        if (el) div.appendChild(toolButton("SVG", "Download this diagram as SVG", () => downloadDiagramSvg(el, index)));
      } catch (e) {
        const leftover = document.getElementById("d" + id);
        if (leftover) leftover.remove();
        const pre = document.createElement("pre");
        pre.className = "mermaid-err";
        pre.textContent = src + "\n\n⚠ " + ((e && e.message) || "Mermaid could not render this diagram");
        div.replaceChildren(pre);
      }
    }
  }
  function highlightAndDiagrams() {
    preview.querySelectorAll("pre > code").forEach((code) => {
      const lang = (code.className.match(/language-([\w-]+)/) || [])[1];
      if (!lang || lang === "mermaid") return;
      if (hljs.getLanguage(lang)) {
        try {
          code.innerHTML = hljs.highlight(code.textContent, { language: lang }).value;
          code.classList.add("hljs");
        } catch (e) { /* leave plain */ }
      }
    });
    const jobs = [];
    preview.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
      const div = document.createElement("div");
      div.className = "mermaid-block";
      const src = code.textContent;
      code.parentElement.replaceWith(div);
      jobs.push({ div, src });
    });
    if (jobs.length) mermaidPending = renderMermaidJobs(jobs);
  }

  /* Per-block downloads: a diagram as SVG, a table as CSV. */
  function toolButton(label, title, onClick) {
    const wrap = document.createElement("div");
    wrap.className = "blk-tools";
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.title = title;
    b.addEventListener("click", onClick);
    wrap.appendChild(b);
    return wrap;
  }

  function downloadDiagramSvg(svg, n) {
    const clone = svg.cloneNode(true);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
    // mermaid emits width="100%" and sizes itself with CSS; a standalone file
    // needs real pixel dimensions, which the viewBox gives us intrinsically.
    const box = svg.getBoundingClientRect();
    const vb = (clone.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number);
    const w = vb.length === 4 && vb[2] ? vb[2] : box.width;
    const h = vb.length === 4 && vb[3] ? vb[3] : box.height;
    clone.setAttribute("width", Math.round(w));
    clone.setAttribute("height", Math.round(h));
    clone.style.maxWidth = "";
    const text = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
    saveBlob(new Blob([text], { type: "image/svg+xml;charset=utf-8" }), baseName() + "-diagram-" + n + ".svg");
    setStatus("Exported diagram " + n + " as SVG");
  }

  const csvCell = (s) => (/[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s);
  function downloadTableCsv(table, n) {
    const rows = [...table.querySelectorAll("tr")].map((tr) =>
      [...tr.querySelectorAll("th, td")].map((c) => csvCell(c.textContent.trim())).join(",")
    );
    // the BOM makes Excel read it as UTF-8 rather than mangling accents
    saveBlob(new Blob(["﻿" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" }),
      baseName() + "-table-" + n + ".csv");
    setStatus("Exported table " + n + " as CSV (" + rows.length + " rows)");
  }

  function addTableTools() {
    let n = 0;
    preview.querySelectorAll("table").forEach((table) => {
      n++;
      const index = n;
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      table.replaceWith(wrap);
      wrap.appendChild(table);
      wrap.appendChild(toolButton("CSV", "Download this table as CSV", () => downloadTableCsv(table, index)));
    });
  }

  /* Table of contents */
  const tocEl = $("toc");
  function buildToc() {
    const hs = preview.querySelectorAll("h1, h2, h3, h4");
    const used = new Set();
    let html = '<div class="toc-title">Contents</div>';
    hs.forEach((h) => {
      let id = h.textContent.trim().toLowerCase().replace(/[^\w\u00C0-\uFFFF]+/g, "-").replace(/^-+|-+$/g, "") || "section";
      while (used.has(id)) id += "-";
      used.add(id);
      h.id = id;
      html += '<a class="d' + h.tagName[1] + '" href="#' + id + '" data-id="' + id + '" title="' + escapeHtml(h.textContent) + '">' + escapeHtml(h.textContent) + "</a>";
    });
    if (!hs.length) html += '<div class="toc-empty">No headings yet</div>';
    tocEl.innerHTML = html;
  }

  function render() {
    const { src, math } = extractMath(editor.value);
    preview.innerHTML = DOMPurify.sanitize(marked.parse(src));
    injectMath(math);
    transformCallouts();
    highlightAndDiagrams();
    // mark task-list items so CSS can drop their bullets
    preview.querySelectorAll('li > input[type="checkbox"]').forEach((cb) => {
      cb.closest("li").classList.add("task");
    });
    addTableTools();
    buildToc();
    updateStats();
  }

  let renderTimer = null;
  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 120);
  }

  function updateStats() {
    const text = editor.value;
    const words = (text.trim().match(/\S+/g) || []).length;
    $("stat-words").textContent = words + " word" + (words === 1 ? "" : "s");
    $("stat-chars").textContent = text.length + " chars";
    const lines = text.length ? text.split("\n").length : 1;
    $("stat-lines").textContent = lines + " line" + (lines === 1 ? "" : "s");
  }

  function setStatus(msg, sticky) {
    statusEl.textContent = msg;
    clearTimeout(statusTimer);
    if (!sticky) statusTimer = setTimeout(() => { statusEl.textContent = ""; }, 4000);
  }

  function setDirty(v) {
    dirty = v;
    dirtyDot.classList.toggle("on", v);
  }

  /* ── Draft persistence (localStorage) ───────── */
  let draftTimer = null;
  function saveDraft() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({ name: filenameEl.value, text: editor.value }));
      } catch (e) { /* storage unavailable — fine */ }
    }, 400);
  }
  function loadDraft() {
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      if (typeof d.text !== "string" || !d.text.trim()) return false;
      editor.value = d.text;
      filenameEl.value = d.name || "untitled.md";
      setStatus("Draft restored from this browser");
      return true;
    } catch (e) { return false; }
  }

  /* ── File loading ───────────────────────────── */
  function loadContent(text, name, handle) {
    editor.value = text.replace(/\r\n/g, "\n");
    filenameEl.value = name || "untitled.md";
    fileHandle = handle || null;
    setDirty(false);
    render();
    saveDraft();
    editor.scrollTop = 0;
    previewPane.scrollTop = 0;
    setStatus("Opened " + filenameEl.value + (fileHandle ? " — Save writes back to the original file" : ""));
  }

  async function openFromFile(file, handle) {
    const text = await file.text();
    loadContent(text, file.name, handle);
  }

  async function openPicker() {
    if (window.showOpenFilePicker) {
      try {
        const [handle] = await window.showOpenFilePicker({
          types: [{ description: "Markdown", accept: { "text/markdown": [".md", ".markdown", ".mdown", ".mkd"], "text/plain": [".txt"] } }],
          excludeAcceptAllOption: false,
        });
        await openFromFile(await handle.getFile(), handle);
      } catch (e) { /* user cancelled */ }
    } else {
      $("file-input").click();
    }
  }
  $("file-input").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (f) openFromFile(f, null);
    e.target.value = "";
  });

  /* ── Saving ─────────────────────────────────── */
  async function writeToHandle(handle) {
    const writable = await handle.createWritable();
    await writable.write(editor.value);
    await writable.close();
  }

  async function save() {
    if (fileHandle) {
      try {
        if (fileHandle.queryPermission && (await fileHandle.queryPermission({ mode: "readwrite" })) !== "granted") {
          if ((await fileHandle.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("denied");
        }
        await writeToHandle(fileHandle);
        setDirty(false);
        setStatus("Saved to " + filenameEl.value);
        return;
      } catch (e) {
        setStatus("Couldn't write to the original file — choose where to save it");
      }
    }
    await saveAs();
  }

  async function saveAs() {
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filenameEl.value || "untitled.md",
          types: [{ description: "Markdown", accept: { "text/markdown": [".md"] } }],
        });
        await writeToHandle(handle);
        fileHandle = handle;
        filenameEl.value = handle.name;
        setDirty(false);
        setStatus("Saved to " + handle.name);
      } catch (e) { /* user cancelled */ }
    } else {
      download();
    }
  }

  function saveBlob(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  const baseName = () => (filenameEl.value || "untitled.md").replace(/\.[^.]+$/, "") || "untitled";

  function download() {
    const name = filenameEl.value || "untitled.md";
    saveBlob(new Blob([editor.value], { type: "text/markdown;charset=utf-8" }), name);
    setDirty(false);
    setStatus("Downloaded " + name);
  }

  /* ── Exports ────────────────────────────────── */
  const pageStyles = () => [...document.querySelectorAll("style")].map((s) => s.textContent).join("\n");

  // Undo the app-shell layout so the exported document is a plain scrolling page.
  const EXPORT_RESET =
    "html,body{height:auto;overflow:visible;display:block}" +
    "body{background:var(--bg);padding:40px 24px}" +
    "#preview{margin:0 auto;padding:0}";

  // a copy of the rendered document without the hover download buttons
  function cleanPreviewClone() {
    const clone = preview.cloneNode(true);
    clone.querySelectorAll(".blk-tools").forEach((n) => n.remove());
    return clone;
  }

  function exportHtml() {
    const title = (preview.querySelector("h1") || {}).textContent || baseName();
    const doc =
      '<!DOCTYPE html>\n<html lang="en" data-theme="' + theme + '">\n<head>\n' +
      '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      "<title>" + escapeHtml(title.trim()) + "</title>\n" +
      "<style>" + pageStyles() + "</style>\n<style>" + EXPORT_RESET + "</style>\n" +
      '</head>\n<body>\n<article id="preview" style="' + escapeHtml(preview.getAttribute("style") || "") + '">\n' +
      cleanPreviewClone().innerHTML +
      "\n</article>\n</body>\n</html>\n";
    saveBlob(new Blob([doc], { type: "text/html;charset=utf-8" }), baseName() + ".html");
    setStatus("Exported " + baseName() + ".html — self-contained, opens anywhere");
  }

  /* PNG: serialize the preview into an SVG <foreignObject> and paint that onto a
     canvas. Everything happens in-page; remote images can't load inside an SVG
     used as an image, so they come out blank (data: URIs are fine). */
  async function exportPng() {
    const P = 36;
    const holder = document.createElement("div");
    holder.style.cssText = "position:fixed;left:-20000px;top:0;";
    const clone = cleanPreviewClone();
    const width = Math.ceil(preview.getBoundingClientRect().width) || 760;
    clone.setAttribute("style", (preview.getAttribute("style") || "") + ";padding:0;margin:0;max-width:none;width:" + width + "px");
    holder.appendChild(clone);
    document.body.appendChild(holder);
    try {
      const height = Math.ceil(clone.getBoundingClientRect().height);
      const W = width + P * 2, H = height + P * 2;
      if (H > 16000) {
        setStatus("This document is too tall for a PNG — use Print / Save as PDF instead");
        return;
      }
      // There is no <html>/<body> inside a foreignObject, so the theme attribute and
      // the font/letter-spacing that normally come from <body> are set on the wrapper.
      const bodyCss = getComputedStyle(document.body);
      const bg = bodyCss.backgroundColor || "#ffffff";
      const wrapStyle = "font-family:" + bodyCss.fontFamily + ";letter-spacing:" + bodyCss.letterSpacing + ";";
      const body =
        '<div xmlns="http://www.w3.org/1999/xhtml" data-theme="' + theme + '" style="' + escapeHtml(wrapStyle) + '">' +
        "<style><![CDATA[" + pageStyles() +
        // a scrollbar painted into a still image is just noise
        "*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}]]></style>" +
        new XMLSerializer().serializeToString(clone) + "</div>";
      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '">' +
        '<rect width="100%" height="100%" fill="' + bg + '"/>' +
        '<foreignObject x="' + P + '" y="' + P + '" width="' + width + '" height="' + height + '">' +
        body + "</foreignObject></svg>";

      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error("the browser could not rasterize this document"));
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      });
      const scale = H * (window.devicePixelRatio || 1) > 16000 ? 1 : Math.min(2, window.devicePixelRatio || 1);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(W * scale);
      canvas.height = Math.round(H * scale);
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
      if (!blob) throw new Error("the image could not be encoded");
      saveBlob(blob, baseName() + ".png");
      setStatus("Exported " + baseName() + ".png (" + canvas.width + "×" + canvas.height + ")");
    } catch (e) {
      setStatus("PNG export failed — " + (e.message || "unknown error") + ". Try Print / Save as PDF.");
    } finally {
      holder.remove();
    }
  }

  /* PDF: the browser's own print-to-PDF, which yields real selectable text.
     Mermaid bakes theme colors into its SVG, so print from the light theme. */
  async function exportPdf() {
    const wasDark = theme === "dark";
    if (wasDark) {
      setTheme("light", false);
      await mermaidPending;
    }
    setStatus('Choose "Save as PDF" as the destination in the print dialog', true);
    if (wasDark) window.addEventListener("afterprint", () => setTheme("dark", false), { once: true });
    window.print();
  }

  /* ── New document ───────────────────────────── */
  function newDoc() {
    if (dirty && !confirm("Discard unsaved changes and start a new document?")) return;
    fileHandle = null;
    editor.value = "";
    filenameEl.value = "untitled.md";
    setDirty(false);
    render();
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    editor.focus();
  }

  /* ── Drag & drop ────────────────────────────── */
  const overlay = $("drop-overlay");
  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => {
    if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) {
      dragDepth++;
      overlay.classList.add("on");
    }
  });
  window.addEventListener("dragleave", () => {
    if (--dragDepth <= 0) { dragDepth = 0; overlay.classList.remove("on"); }
  });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", async (e) => {
    e.preventDefault();
    dragDepth = 0;
    overlay.classList.remove("on");
    const item = e.dataTransfer.items && e.dataTransfer.items[0];
    if (!item || item.kind !== "file") return;
    // Prefer a real file handle so Save can write back to the dropped file.
    if (item.getAsFileSystemHandle) {
      try {
        const handle = await item.getAsFileSystemHandle();
        if (handle && handle.kind === "file") {
          await openFromFile(await handle.getFile(), handle);
          return;
        }
      } catch (err) { /* fall through to plain File */ }
    }
    const file = item.getAsFile();
    if (file) await openFromFile(file, null);
  });

  /* ── Editor behaviour ───────────────────────── */
  editor.addEventListener("input", () => {
    setDirty(true);
    scheduleRender();
    saveDraft();
  });

  editor.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const { selectionStart: s, selectionEnd: en } = editor;
      editor.setRangeText("  ", s, en, "end");
      editor.dispatchEvent(new Event("input"));
    }
  });

  // proportional scroll sync: editor → preview
  editor.addEventListener("scroll", () => {
    if (document.body.dataset.view !== "split") return;
    const eMax = editor.scrollHeight - editor.clientHeight;
    const pMax = previewPane.scrollHeight - previewPane.clientHeight;
    if (eMax > 0 && pMax > 0) previewPane.scrollTop = (editor.scrollTop / eMax) * pMax;
  });

  filenameEl.addEventListener("change", () => {
    let name = filenameEl.value.trim() || "untitled.md";
    if (!/\.(md|markdown|mdown|mkd|txt)$/i.test(name)) name += ".md";
    filenameEl.value = name;
    fileHandle = null; // renamed → next Save asks where to put it
    saveDraft();
  });
  filenameEl.addEventListener("keydown", (e) => { if (e.key === "Enter") filenameEl.blur(); });

  /* ── TOC toggle ─────────────────────────────── */
  const TOC_KEY = "md-viewer-toc";
  const isDrawer = () => matchMedia("(max-width: 900px)").matches;

  function setToc(on) {
    document.body.classList.toggle("toc-open", on);
    $("btn-toc").classList.toggle("toggled", on);
  }
  $("btn-toc").addEventListener("click", (e) => {
    e.stopPropagation();
    const on = !document.body.classList.contains("toc-open");
    setToc(on);
    try { localStorage.setItem(TOC_KEY, on ? "1" : "0"); } catch (e2) {}
  });
  // Don't restore an open contents panel on a phone — it would cover the page on load.
  try {
    if (localStorage.getItem(TOC_KEY) === "1" && !isDrawer()) setToc(true);
  } catch (e) {}

  $("toc-backdrop").addEventListener("click", () => setToc(false));

  tocEl.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-id]");
    if (!a) return;
    e.preventDefault();
    const h = document.getElementById(a.dataset.id);
    if (h) {
      // In split view on a phone the preview may be scrolled out of sight itself.
      if (isDrawer() && document.body.dataset.view === "split") h.scrollIntoView({ block: "start" });
      else previewPane.scrollTop = h.getBoundingClientRect().top - previewPane.getBoundingClientRect().top + previewPane.scrollTop - 20;
    }
    if (isDrawer()) setToc(false);
  });

  /* ── Reader controls ────────────────────────── */
  const READER_KEY = "md-viewer-reader";
  const readerPop = $("reader-pop");
  let reader = { size: 14.5, width: 760 };
  try { Object.assign(reader, JSON.parse(localStorage.getItem(READER_KEY) || "{}")); } catch (e) {}
  function applyReader() {
    preview.style.setProperty("--reader-size", reader.size + "px");
    preview.style.setProperty("--reader-width", reader.width ? reader.width + "px" : "100%");
    $("size-val").textContent = reader.size + "px";
    $("size-range").value = reader.size;
    readerPop.querySelectorAll(".wbtn").forEach((b) => b.classList.toggle("active", +b.dataset.w === reader.width));
  }
  function saveReader() {
    try { localStorage.setItem(READER_KEY, JSON.stringify(reader)); } catch (e) {}
  }
  $("btn-reader").addEventListener("click", (e) => {
    e.stopPropagation();
    readerPop.classList.toggle("on");
    $("btn-reader").classList.toggle("toggled", readerPop.classList.contains("on"));
  });
  readerPop.addEventListener("click", (e) => e.stopPropagation());
  document.addEventListener("click", () => {
    readerPop.classList.remove("on");
    $("btn-reader").classList.remove("toggled");
    $("export-pop").classList.remove("on");
    $("btn-export").classList.remove("toggled");
  });
  $("size-range").addEventListener("input", () => {
    reader.size = +$("size-range").value;
    applyReader();
    saveReader();
  });
  readerPop.querySelectorAll(".wbtn").forEach((b) => {
    b.addEventListener("click", () => {
      reader.width = +b.dataset.w;
      applyReader();
      saveReader();
    });
  });
  applyReader();

  /* ── View modes ─────────────────────────────── */
  function setView(mode) {
    document.body.dataset.view = mode;
    document.querySelectorAll(".seg button").forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
  }
  document.querySelectorAll(".seg button").forEach((btn) => {
    btn.addEventListener("click", () => {
      setView(btn.dataset.mode);
      if (btn.dataset.mode !== "preview") editor.focus();
    });
  });
  // A side-by-side split is unreadable on a phone, and reading is the common case there.
  if (isDrawer()) setView("preview");

  /* ── Theme ──────────────────────────────────── */
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    $("icon-moon").style.display = t === "dark" ? "none" : "";
    $("icon-sun").style.display = t === "dark" ? "" : "none";
  }
  let theme;
  try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (theme !== "light" && theme !== "dark") {
    theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  applyTheme(theme);
  initMermaid();
  // mermaid bakes colors into its SVG, so a theme change means a full re-render
  function setTheme(t, persist) {
    theme = t;
    applyTheme(t);
    if (persist) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
    initMermaid();
    render();
  }
  $("btn-theme").addEventListener("click", () => setTheme(theme === "dark" ? "light" : "dark", true));

  /* ── Keyboard shortcuts ─────────────────────── */
  window.addEventListener("keydown", (e) => {
    const mod = isMac ? e.metaKey : e.ctrlKey;
    if (!mod) return;
    const k = e.key.toLowerCase();
    if (k === "s") { e.preventDefault(); e.shiftKey ? saveAs() : save(); }
    else if (k === "o") { e.preventDefault(); openPicker(); }
  });

  window.addEventListener("beforeunload", (e) => {
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });

  /* ── Buttons ────────────────────────────────── */
  $("btn-open").addEventListener("click", openPicker);
  $("btn-save").addEventListener("click", save);
  $("btn-new").addEventListener("click", newDoc);

  const exportPop = $("export-pop");
  $("btn-export").addEventListener("click", (e) => {
    e.stopPropagation();
    exportPop.classList.toggle("on");
    $("btn-export").classList.toggle("toggled", exportPop.classList.contains("on"));
  });
  exportPop.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-exp]");
    if (!b) return;
    exportPop.classList.remove("on");
    $("btn-export").classList.remove("toggled");
    ({ md: download, html: exportHtml, png: exportPng, pdf: exportPdf })[b.dataset.exp]();
  });

  /* ── Installed-app plumbing ─────────────────── */
  // Registering a service worker makes the app installable and lets it open
  // offline. It is skipped when the file is opened straight from disk.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  // When the installed app is launched by opening a .md file (double-click,
  // "Open with"), we receive real file handles — so Save writes back to that
  // very file, exactly like the drag-and-drop path.
  if ("launchQueue" in window && typeof LaunchParams !== "undefined" && "files" in LaunchParams.prototype) {
    launchQueue.setConsumer(async (params) => {
      if (!params.files || !params.files.length) return;
      try {
        const handle = params.files[0];
        await openFromFile(await handle.getFile(), handle);
      } catch (e) {
        setStatus("Could not open that file — " + (e.message || "unknown error"));
      }
    });
  }

  /* ── Boot ───────────────────────────────────── */
  const WELCOME = `# Free MD Viewer

A fast, private markdown viewer & editor that runs entirely in your browser — **nothing you type or open ever leaves your device**.

## Getting started

- **Drop** a \`.md\` file anywhere on this page, or click **Open**
- Type on the left, see the result on the right
- **Save** writes straight back to the original file (Chrome & Edge) — elsewhere it downloads a copy
- **Export** the rendered document as a self-contained \`.html\` page, a \`.png\` image, or a PDF
- **Install it** (Chrome & Edge) and \`.md\` files open here on double-click, even offline
- Your work is kept as a draft in this browser, so a refresh won't lose it

## What it understands

GitHub-flavored markdown, including:

| Feature | Example |
| ------- | ------- |
| Emphasis | *italic*, **bold**, ~~strikethrough~~ |
| Inline code | \`const x = 42\` |
| Links | [ivystrides.com](https://www.ivystrides.com) |

- [x] Task lists
- [ ] Like this one

> [!TIP]
> Use the list button up top for a **table of contents**, and the **Aa** button to adjust text size and line width. Hover a table or a diagram to download it on its own.

### Syntax-highlighted code

\`\`\`js
// fenced code blocks, now with highlighting
function greet(name) {
  return \`Hello, \${name}!\`;
}
\`\`\`

### Math

Inline math like $E = mc^2$ works, and so do display equations:

$$
\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}
$$

### Diagrams

Mermaid code fences render as live diagrams:

\`\`\`mermaid
flowchart LR
  A[Drop a .md file] --> B{Edit it?}
  B -- yes --> C[Make changes] --> D[Save back to your device]
  B -- no --> E[Just read]
\`\`\`

### Callouts

> [!NOTE]
> GitHub-style callouts — NOTE, TIP, IMPORTANT, WARNING, and CAUTION — all render properly.

---

Shortcuts: **${isMac ? "⌘" : "Ctrl+"}S** save · **${isMac ? "⌘⇧" : "Ctrl+Shift+"}S** save as · **${isMac ? "⌘" : "Ctrl+"}O** open
`;

  if (!loadDraft()) editor.value = WELCOME;
  render();
  editor.focus();
})();
</script>
</body>
</html>
